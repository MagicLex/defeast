[project]
name = "import-feast"
version = "0.1.0"
description = "Replay a Feast feature repo into Hopsworks feature groups and feature views"
requires-python = ">=3.9"
dependencies = ["feast", "pyarrow"]

[project.scripts]
import-feast = "import_feast.cli:main"

[tool.setuptools]
packages = ["import_feast"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
