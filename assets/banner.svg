<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="defeast: the honest Feast benchmark and the bridge to Hopsworks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#17171d"/>
    </linearGradient>
    <linearGradient id="feastline" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#eb6834" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#eb6834"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- faint baseline grid -->
  <g stroke="#26262c" stroke-width="1">
    <line x1="700" y1="300" x2="1200" y2="300"/>
    <line x1="700" y1="234" x2="1200" y2="234"/>
    <line x1="700" y1="168" x2="1200" y2="168"/>
    <line x1="700" y1="102" x2="1200" y2="102"/>
  </g>

  <!-- the motif: Feast climbs, Hopsworks stays flat. The whole thesis in two curves. -->
  <path d="M700,290 C 792,280 812,258 858,236 S 992,150 1188,72" fill="none" stroke="url(#feastline)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M700,301 C 858,297 1012,291 1188,282" fill="none" stroke="#2a78d6" stroke-width="4.5" stroke-linecap="round"/>

  <circle cx="1188" cy="72" r="7" fill="#eb6834"/>
  <circle cx="1188" cy="282" r="7" fill="#2a78d6"/>

  <text x="1150" y="180" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="700" fill="#eb6834">27.9&#215;</text>
  <text x="1150" y="205" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8a8a90">at batch 100</text>

  <!-- wordmark -->
  <text x="78" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#6f6f77">FEAST</text>
  <path d="M150,145 H172 M165,139 L172,145 L165,151" fill="none" stroke="#6f6f77" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="184" y="150" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#6f6f77">HOPSWORKS</text>
  <text x="74" y="238" font-family="Helvetica Neue, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-3" fill="#f4f4f2">defeast</text>
  <rect x="80" y="258" width="70" height="5" rx="2.5" fill="#eb6834"/>
  <rect x="156" y="258" width="70" height="5" rx="2.5" fill="#2a78d6"/>
  <text x="80" y="300" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#a7a7a1">The honest Feast benchmark, and the one-shot bridge out.</text>
</svg>
